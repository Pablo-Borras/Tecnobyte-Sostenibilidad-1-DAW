<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- La letra T en binario (0101 0100), en dos filas de cuatro bits -->
  <rect width="32" height="32" rx="4" fill="#140a22"/>
  <g fill="#45335f">
    <rect x="4" y="9" width="5" height="5"/><rect x="17" y="9" width="5" height="5"/>
    <rect x="4" y="18" width="5" height="5"/><rect x="17" y="18" width="5" height="5"/><rect x="23.5" y="18" width="5" height="5"/>
  </g>
  <g fill="#b9a2ff">
    <rect x="10.5" y="9" width="5" height="5"/><rect x="23.5" y="9" width="5" height="5"/>
    <rect x="10.5" y="18" width="5" height="5"/>
  </g>
</svg>
